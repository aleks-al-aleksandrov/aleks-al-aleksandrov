<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Impact: reporting 8 hours to 90 minutes, label extraction 2 weeks to 3-4 days, meeting prep 15-25 minutes to under 5, printed pages per week 100+ to 0">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <g transform="translate(0 0)">
      <rect width="285" height="190" rx="16" fill="url(#card)" stroke="#1e293b"/>
      <rect x="24" y="24" width="40" height="4" rx="2" fill="url(#accent)"/>
      <text x="24" y="58" fill="#94a3b8" font-size="15" font-weight="600">MONTHLY REPORTING</text>
      <text x="24" y="104" fill="#64748b" font-size="22" text-decoration="line-through">8 hours</text>
      <text x="118" y="104" fill="#475569" font-size="22">→</text>
      <text x="148" y="104" fill="#ffffff" font-size="30" font-weight="700">90 min</text>
      <text x="24" y="140" fill="#cbd5e1" font-size="15">30 legacy SQL reports moved</text>
      <text x="24" y="162" fill="#cbd5e1" font-size="15">to SAP DataSphere</text>
    </g>
    <!-- card 2 -->
    <g transform="translate(305 0)">
      <rect width="285" height="190" rx="16" fill="url(#card)" stroke="#1e293b"/>
      <rect x="24" y="24" width="40" height="4" rx="2" fill="url(#accent)"/>
      <text x="24" y="58" fill="#94a3b8" font-size="15" font-weight="600">LABEL EXTRACTION</text>
      <text x="24" y="104" fill="#64748b" font-size="22" text-decoration="line-through">2 weeks</text>
      <text x="112" y="104" fill="#475569" font-size="22">→</text>
      <text x="140" y="104" fill="#ffffff" font-size="28" font-weight="700">3–4 days</text>
      <text x="24" y="140" fill="#cbd5e1" font-size="15">YOLO + OCR pipeline in Python</text>
      <text x="24" y="162" fill="#cbd5e1" font-size="15">and Azure ML, 3,000+ labels/batch</text>
    </g>
    <!-- card 3 -->
    <g transform="translate(610 0)">
      <rect width="285" height="190" rx="16" fill="url(#card)" stroke="#1e293b"/>
      <rect x="24" y="24" width="40" height="4" rx="2" fill="url(#accent)"/>
      <text x="24" y="58" fill="#94a3b8" font-size="15" font-weight="600">DAILY MEETING PREP</text>
      <text x="24" y="104" fill="#64748b" font-size="22" text-decoration="line-through">25 min</text>
      <text x="108" y="104" fill="#475569" font-size="22">→</text>
      <text x="138" y="104" fill="#ffffff" font-size="30" font-weight="700">&lt;5 min</text>
      <text x="24" y="140" fill="#cbd5e1" font-size="15">Offline-first screen system</text>
      <text x="24" y="162" fill="#cbd5e1" font-size="15">piloted with warehouse managers</text>
    </g>
    <!-- card 4 -->
    <g transform="translate(915 0)">
      <rect width="285" height="190" rx="16" fill="url(#card)" stroke="#1e293b"/>
      <rect x="24" y="24" width="40" height="4" rx="2" fill="url(#accent)"/>
      <text x="24" y="58" fill="#94a3b8" font-size="15" font-weight="600">PRINTED PAGES / WEEK</text>
      <text x="24" y="104" fill="#64748b" font-size="22" text-decoration="line-through">100+</text>
      <text x="88" y="104" fill="#475569" font-size="22">→</text>
      <text x="118" y="104" fill="#ffffff" font-size="30" font-weight="700">0</text>
      <text x="24" y="140" fill="#cbd5e1" font-size="15">3 internal web apps replacing</text>
      <text x="24" y="162" fill="#cbd5e1" font-size="15">paper workflows, still in use</text>
    </g>
  </g>
</svg>
