<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Aleks Aleksandrov — Data Engineer and Analytics Engineer. From the warehouse floor to data and automation.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .fade { opacity: 0; animation: fadeUp 0.8s ease-out forwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.5s; } .d3 { animation-delay: 0.9s; }
      .d4 { animation-delay: 1.4s; } .d5 { animation-delay: 1.8s; } .d6 { animation-delay: 2.2s; }
      .d7 { animation-delay: 2.6s; } .d8 { animation-delay: 3.2s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

      .underline { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
                   animation: grow 0.9s 0.4s ease-out forwards; }
      @keyframes grow { to { transform: scaleX(1); } }

      .b { transform-box: fill-box; transform-origin: bottom center; transform: scaleY(0);
           animation: rise 0.9s cubic-bezier(.2,.8,.2,1) forwards; }
      .b1 { animation-delay: 0.6s; } .b2 { animation-delay: 0.75s; } .b3 { animation-delay: 0.9s; }
      .b4 { animation-delay: 1.05s; } .b5 { animation-delay: 1.2s; } .b6 { animation-delay: 1.35s; }
      @keyframes rise { to { transform: scaleY(1); } }

      .trend { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.6s 1.4s ease-in-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .tip { opacity: 0; animation: fadeUp 0.4s 2.9s forwards, pulse 2.4s 3.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
      .halo { opacity: 0; animation: halo 2.4s 3.3s ease-in-out infinite; }
      @keyframes halo { 0%,100% { opacity: 0.2; } 50% { opacity: 0.9; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- rising bars and trend line: manual work turning into automation -->
  <g transform="translate(820 60)">
    <rect class="b b1" x="0"   y="150" width="34" height="50"  rx="5" fill="url(#bar)"/>
    <rect class="b b2" x="48"  y="125" width="34" height="75"  rx="5" fill="url(#bar)"/>
    <rect class="b b3" x="96"  y="135" width="34" height="65"  rx="5" fill="url(#bar)"/>
    <rect class="b b4" x="144" y="95"  width="34" height="105" rx="5" fill="url(#bar)"/>
    <rect class="b b5" x="192" y="60"  width="34" height="140" rx="5" fill="url(#bar)"/>
    <rect class="b b6" x="240" y="20"  width="34" height="180" rx="5" fill="url(#bar)"/>
    <line x1="-10" y1="200" x2="290" y2="200" stroke="#ffffff" stroke-opacity="0.15"/>
    <polyline class="trend" points="17,140 65,115 113,125 161,85 209,50 257,10" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="halo" cx="257" cy="10" r="22" fill="url(#glow)"/>
    <circle class="tip" cx="257" cy="10" r="6" fill="#818cf8"/>
  </g>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text class="fade d1" x="64" y="104" fill="#ffffff" font-size="52" font-weight="700" letter-spacing="-0.5">Aleks Aleksandrov</text>
    <rect class="underline" x="64" y="124" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text class="fade d2" x="64" y="166" fill="#cbd5e1" font-size="26" font-weight="600">Data Engineer · Analytics Engineer</text>
    <text class="fade d3" x="64" y="206" fill="#94a3b8" font-size="20">I turn slow, manual business processes into data that just works.</text>

    <!-- career path, revealed step by step -->
    <g font-size="15" fill="#94a3b8">
      <g class="fade d4"><circle cx="70" cy="262" r="5" fill="#38bdf8"/><text x="84" y="267">Warehouse floor</text></g>
      <g class="fade d5"><text x="212" y="267" fill="#475569">→</text><circle cx="240" cy="262" r="5" fill="#4fa6f8"/><text x="254" y="267">Shift lead</text></g>
      <g class="fade d6"><text x="340" y="267" fill="#475569">→</text><circle cx="368" cy="262" r="5" fill="#6597f8"/><text x="382" y="267">Pricing analytics</text></g>
      <g class="fade d7"><text x="520" y="267" fill="#475569">→</text><circle cx="548" cy="262" r="5" fill="#818cf8"/><text x="562" y="267" fill="#e2e8f0" font-weight="600">Data &amp; automation</text></g>
    </g>

    <text class="fade d8" x="1136" y="290" fill="#64748b" font-size="15" text-anchor="end">Bulgaria · Open to on-site, hybrid &amp; remote</text>
  </g>
</svg>
