<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Aleks Aleksandrov — Data Engineer and Analytics Engineer. From the warehouse floor to data and automation.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      /* Only opacity and transform are animated, every animation runs once and then the
         image is fully static — no infinite loops, no filters, so it stays smooth. */
      .in   { opacity: 0; animation: in 0.7s cubic-bezier(.22,.61,.36,1) both; }
      @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .d1 { animation-delay: .05s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .45s; }
      .d4 { animation-delay: .75s; } .d5 { animation-delay: .9s; }  .d6 { animation-delay: 1.05s; }
      .d7 { animation-delay: 1.2s; } .d8 { animation-delay: 1.5s; }

      .line { transform-box: fill-box; transform-origin: left center; animation: grow .8s .3s cubic-bezier(.22,.61,.36,1) both; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

      .b { transform-box: fill-box; transform-origin: center bottom; animation: rise .8s cubic-bezier(.22,.61,.36,1) both; }
      @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      .b1 { animation-delay: .3s; } .b2 { animation-delay: .4s; } .b3 { animation-delay: .5s; }
      .b4 { animation-delay: .6s; } .b5 { animation-delay: .7s; } .b6 { animation-delay: .8s; }

      .trend { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.1s 1s cubic-bezier(.45,0,.25,1) forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .tip  { opacity: 0; animation: in .5s 2s cubic-bezier(.22,.61,.36,1) both; }

      @media (prefers-reduced-motion: reduce) {
        .in, .line, .b, .tip { animation: none; opacity: 1; transform: none; }
        .trend { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <path d="M40 0V320M80 0V320M120 0V320M160 0V320M200 0V320M240 0V320M280 0V320M320 0V320M360 0V320M400 0V320M440 0V320M480 0V320M520 0V320M560 0V320M600 0V320M640 0V320M680 0V320M720 0V320M760 0V320M800 0V320M840 0V320M880 0V320M920 0V320M960 0V320M1000 0V320M1040 0V320M1080 0V320M1120 0V320M1160 0V320M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200" stroke="#ffffff" stroke-opacity="0.04" fill="none"/>

    <!-- rising bars and trend line: manual work turning into automation -->
    <g transform="translate(820 60)">
      <rect class="b b1" x="0"   y="150" width="34" height="50"  rx="5" fill="url(#bar)"/>
      <rect class="b b2" x="48"  y="125" width="34" height="75"  rx="5" fill="url(#bar)"/>
      <rect class="b b3" x="96"  y="135" width="34" height="65"  rx="5" fill="url(#bar)"/>
      <rect class="b b4" x="144" y="95"  width="34" height="105" rx="5" fill="url(#bar)"/>
      <rect class="b b5" x="192" y="60"  width="34" height="140" rx="5" fill="url(#bar)"/>
      <rect class="b b6" x="240" y="20"  width="34" height="180" rx="5" fill="url(#bar)"/>
      <line x1="-10" y1="200" x2="290" y2="200" stroke="#ffffff" stroke-opacity="0.15"/>
      <polyline class="trend" points="17,140 65,115 113,125 161,85 209,50 257,10" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="tip">
        <circle cx="257" cy="10" r="14" fill="#818cf8" fill-opacity="0.18"/>
        <circle cx="257" cy="10" r="6" fill="#818cf8"/>
      </g>
    </g>

    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
      <text class="in d1" x="64" y="104" fill="#ffffff" font-size="52" font-weight="700" letter-spacing="-0.5">Aleks Aleksandrov</text>
      <rect class="line" x="64" y="124" width="96" height="4" rx="2" fill="url(#accent)"/>
      <text class="in d2" x="64" y="166" fill="#cbd5e1" font-size="26" font-weight="600">Data Engineer · Analytics Engineer</text>
      <text class="in d3" x="64" y="206" fill="#94a3b8" font-size="20">I turn slow, manual business processes into data that just works.</text>

      <!-- career path, revealed step by step -->
      <g font-size="15" fill="#94a3b8">
        <g class="in d4"><circle cx="70" cy="262" r="5" fill="#38bdf8"/><text x="84" y="267">Warehouse floor</text></g>
        <g class="in d5"><text x="212" y="267" fill="#475569">→</text><circle cx="240" cy="262" r="5" fill="#4fa6f8"/><text x="254" y="267">Shift lead</text></g>
        <g class="in d6"><text x="340" y="267" fill="#475569">→</text><circle cx="368" cy="262" r="5" fill="#6597f8"/><text x="382" y="267">Pricing analytics</text></g>
        <g class="in d7"><text x="520" y="267" fill="#475569">→</text><circle cx="548" cy="262" r="5" fill="#818cf8"/><text x="562" y="267" fill="#e2e8f0" font-weight="600">Data &amp; automation</text></g>
      </g>

      <text class="in d8" x="1136" y="290" fill="#64748b" font-size="15" text-anchor="end">Bulgaria · Open to on-site, hybrid &amp; remote</text>
    </g>
  </g>
</svg>
